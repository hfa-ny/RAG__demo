name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  typescript-tests:
    name: typescript-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts_demo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ts_demo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  typescript-build:
    name: typescript-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts_demo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ts_demo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  python-syntax:
    name: python-syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python files
        run: python -m py_compile py_demo/app.py py_demo/document_loader.py

  docker-compose-config:
    name: docker-compose-config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose config
        run: docker compose config
